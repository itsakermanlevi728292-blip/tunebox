<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunebox</title>
<style>
:root{--bg:#101326;--surface:#1a1f3a;--line:#2b3157;--text:#e9e8f2;--muted:#9aa0c4;--accent:#7c9cff;--hot:#ff8fa3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
main{max-width:640px;margin:0 auto;padding:28px 16px}
h1{font-size:2.2rem;letter-spacing:-.03em;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:20px}
form{display:flex;gap:8px;margin-bottom:22px}
input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font-size:1rem}
button{font:inherit;cursor:pointer;border:0;color:inherit}
form button{background:var(--accent);color:#0b1030;font-weight:600;border-radius:10px;padding:0 18px}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
h2{font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:10px}
.t{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;padding:8px;border-radius:10px}
.t:hover{background:var(--surface)}
.t.on{background:var(--surface);box-shadow:inset 3px 0 var(--hot)}
.t img,.ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t span{color:var(--muted);font-size:.875rem}
.t div{min-width:0;flex:1}
#yt{margin-bottom:22px}
.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytx{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted)}
.msg{color:var(--muted);padding:20px 8px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#bar .in{max-width:640px;margin:0 auto}
#now{display:flex;align-items:center;gap:10px}
#now img{width:44px;height:44px;border-radius:8px;background:var(--line)}
#nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nt small{display:block;color:var(--muted)}
.c{background:var(--line);width:42px;height:42px;border-radius:50%;font-size:1.1rem}
#pp{background:var(--accent);color:#0b1030}
#seek{width:100%;margin-top:8px;accent-color:var(--hot)}
</style>
</head>
<body>
<main>
  <h1>Tunebox</h1>
  <p class="sub">Search any song and play it. Search songs, or paste a YouTube link to play the full video.</p>
  <form id="f"><input id="q" type="search" placeholder="Search songs or paste a YouTube link" aria-label="Search songs or paste a YouTube link"><button>Search</button></form>
  <div id="yt" hidden>
    <div class="vid"><iframe id="yf" title="YouTube player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <button id="ytx" type="button">Close video</button>
  </div>
  <h2 id="h">Trending now</h2>
  <div id="list"><p class="msg">Loading…</p></div>
</main>

<div id="bar"><div class="in">
  <div id="now">
    <img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <div id="nt">Pick a song to start</div>
    <button class="c" id="prev" aria-label="Previous">⏮</button>
    <button class="c" id="pp" aria-label="Play or pause">▶</button>
    <button class="c" id="next" aria-label="Next">⏭</button>
  </div>
  <input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek">
</div></div>
<audio id="a" preload="none"></audio>

<script>
const APP = "tunebox";
const HOSTS = ["https://api.audius.co", "https://discoveryprovider.audius.co"];
const $ = id => document.getElementById(id);
const a = $("a"); let tracks = [], cur = -1, host = HOSTS[0];

async function api(path) {
  for (const h of [host, ...HOSTS.filter(x => x !== host)]) {
    try {
      const r = await fetch(`${h}/v1${path}${path.includes("?") ? "&" : "?"}app_name=${APP}`);
      if (!r.ok) throw 0;
      host = h;
      return (await r.json()).data;
    } catch (e) {}
  }
  throw new Error("Server not reachable");
}
function ytId(u) {
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function showYT(id) {
  a.pause();
  $("yf").src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  $("yt").hidden = false;
}
function hideYT() { $("yf").src = "about:blank"; $("yt").hidden = true; }
$("ytx").onclick = hideYT;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render() {
  const L = $("list");
  if (!tracks.length) { L.innerHTML = '<p class="msg">No songs found. Try another name.</p>'; return; }
  L.innerHTML = tracks.map((t, i) => {
    const img = t.art;
    return `<button class="t${i === cur ? " on" : ""}" data-i="${i}">${img ? `<img src="${esc(img)}" alt="">` : '<div class="ph"></div>'}<div><b>${esc(t.title)}</b><span>${esc(t.name)}${t.preview ? " (30s preview)" : ""}</span></div></button>`;
  }).join("");
}
const fromAudius = t => ({id: t.id, title: t.title, name: t.user.name, art: t.artwork && (t.artwork["150x150"] || t.artwork["480x480"]), src: null});
const fromItunes = r => ({title: r.trackName, name: r.artistName, art: r.artworkUrl100, src: r.previewUrl, preview: true});
async function itunes(q) {
  const r = await fetch(`https://itunes.apple.com/search?media=music&entity=song&limit=25&term=${encodeURIComponent(q)}`);
  return (await r.json()).results.filter(x => x.previewUrl).map(fromItunes);
}
async function load(q) {
  $("h").textContent = q ? `Results for “${q}”` : "Trending now";
  $("list").innerHTML = '<p class="msg">Loading…</p>';
  const jobs = q
    ? [api(`/tracks/search?query=${encodeURIComponent(q)}`).then(d => d.map(fromAudius)), itunes(q)]
    : [api("/tracks/trending").then(d => d.map(fromAudius))];
  const res = await Promise.allSettled(jobs);
  tracks = res.flatMap(r => r.status === "fulfilled" ? r.value : []);
  cur = -1;
  if (!tracks.length && res.every(r => r.status === "rejected")) $("list").innerHTML = '<p class="msg">Could not load songs. Check your connection and search again.</p>';
  else render();
}
function play(i) {
  const t = tracks[i]; if (!t) return;
  cur = i;
  hideYT();
  a.src = t.src || `${host}/v1/tracks/${t.id}/stream?app_name=${APP}`;
  a.play().catch(() => {});
  $("nt").innerHTML = `${esc(t.title)}<small>${esc(t.name)}</small>`;
  const img = t.art;
  $("art").src = img || $("art").src;
  render();
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: t.title, artist: t.name, artwork: img ? [{src: img}] : []});
}
$("list").onclick = e => { const b = e.target.closest(".t"); if (b) play(+b.dataset.i); };
$("f").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); const id = ytId(q); if (id) { showYT(id); $("q").value = ""; } else load(q); };
$("pp").onclick = () => { if (cur < 0 && tracks.length) play(0); else a.paused ? a.play() : a.pause(); };
$("next").onclick = () => tracks.length && play((cur + 1) % tracks.length);
$("prev").onclick = () => tracks.length && play((cur - 1 + tracks.length) % tracks.length);
a.onplay = () => $("pp").textContent = "⏸";
a.onpause = () => $("pp").textContent = "▶";
a.onended = () => $("next").click();
a.ontimeupdate = () => { if (a.duration) $("seek").value = a.currentTime / a.duration * 100; };
$("seek").oninput = () => { if (a.duration) a.currentTime = $("seek").value / 100 * a.duration; };
load("");
</script>
</body>
</html>
